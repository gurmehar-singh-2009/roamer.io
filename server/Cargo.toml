[package]
name = "server"
version = "0.1.0"
edition = "2021"
license.workspace = true
description.workspace = true
keywords.workspace = true
repository.workspace = true
readme = "../README.md"
categories.workspace = true

[dependencies]
config = { version = "0.15.19", features = ["toml"] }
rapier2d = { version = "0.31.0", features = ["simd-stable"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
borsh = "1.8.0"
bevy_ecs = "0.17.3"
wtransport = "0.7.1"
dashmap = "6.1.0"
snafu = "0.9.0"
borsh-derive = "1.6.0"
shared = { path = "../shared", features = ["server"] }
tracing-subscriber = "0.3.22"
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
rayon = "1.11.0"
parking_lot = "0.12.5"
chacha20poly1305 = "0.10.1"
rand_core = "0.6"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10.9"
pqc_kyber = { version = "0.7.1", features = ["kyber768", "90s"] }
hkdf = "0.12.4"
nanorand = { version = "0.8.0", features = ["wyrand", "chacha"] }
once_cell = "1.21.3"
mimalloc = { version = "0.1.49", features = ["secure"] }
rustrict = "0.7.38"
rstar = "0.12.2"
# TLS through rustls with the `ring` backend (already used by wtransport), so
# the server builds as a static musl binary without a C toolchain for aws-lc.
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "charset", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.150"

[lints]
workspace = true
