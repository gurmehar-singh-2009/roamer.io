[package]
name = "roamer-client"
version = "0.1.0"
edition = "2024"
description = "Serves the built Roamer.io web client."
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords = ["game", "multiplayer", "server", "static", "http"]
readme = "../../README.md"

[[bin]]
name = "roamer-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time"] }

[lints]
workspace = true
