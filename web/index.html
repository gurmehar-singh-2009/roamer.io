<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <title>Foes.io</title>
   <link rel="shortcut icon" type="image/png" href="/web/20190120075244im_/https://foes.io/images/favicon.png?v=10" />
   <meta name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
   <meta name="description" content="Foes.io is a free multiplayer battle royale online game">
   <meta name="keywords" content="game,games,pubg,battleground,royale,fortnite,gaming,online,io,multiplayer,free">
   <meta http-equiv="Cache-control" content="public">
   <link rel="stylesheet" href="mainstyle.css" />
   <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

   <script type="module" src="/src/game.js"></script>
</head>

<body>
      <input id="chatbox" placeholder="enter chat..." maxlength="30" />

   <!-- MAIN CANVAS -->
   <canvas id="mainCanvas" oncontextmenu="return false;"></canvas>
   <!-- VIGNETTE -->
   <img id="vignette" src="public/vignette.png" />
   <!-- DARKENER -->
   <div id="darkener"></div>
   <!-- LOADING CONTAINER -->
   <div id="loadingContainer">
      <div id="loadingText">Loading...</div>
      <div id="loadingSubtext"></div>
      <div id="reloadButton" class="menuButton" onclick="location.reload()" style="display:none">Reload</div>
   </div>
   <!-- SETTINGS CONTAINER -->
   <div id="settingsContainer">
      <div class="settingsIcon" onclick="showLeaderboard()">
         <i class="material-icons" style="color:#fff;font-size:45px">&#xE24B;</i>
      </div>
      <div class="settingsIcon" onclick="window.showInfoScreen(4)">
         <i class="material-icons" style="color:#fff;font-size:45px">&#xE8B8;</i>
      </div>
      <div id="soundSetting" style="display: inline-block" onclick="toggleSound();"></div>
   </div>
   <!-- SHARED UI -->
   <div id="sharedUI">
      <div id="topMenuContainer">
      </div>
      <canvas id="minimap"></canvas>
      <div id="borderTimer">00:00</div>
   </div>

   <!-- SPECTATE UI -->
   <div id="spectateContainer">
      <div id="matchOverContainer">
         <div id="inGameAd">
            <div align="center" id="foesio_728x90_1">
               <script data-cfasync="false" type="text/javascript">
                  // freestar.queue.push(function () { googletag.display('foesio_728x90_1'); });
               </script>
            </div>
         </div>
         <div id="matchOverText">wait until next round</div>
      </div>
      <div id="deathMessage"></div>
      <div id="gameOverMessage"></div>
      <div id="roundInfo">
         <div id="rankCount"></div>
         <div id="tokenCount"></div>
      </div>
      <div id="endButtonHolder">
         <div id="playAgainButton" class="endButton" onclick="enterGame(true)" style="margin-right:20px">Play Again
         </div>
         <div class="endButton" onclick="toggleMenu(true)">Exit to Lobby</div>
      </div>
      <div id="spectateText">
         <div style="color:rgba(255,255,255,0.3);font-size:30px;margin-bottom:15px;">
            [Mouse1] Next
         </div>
         <div style="color:#fff;font-size:52px">Spectating</div>
      </div>
   </div>
   
   <!-- GAME UI -->
   <div id="uiContainer">
      <div id="voiceDisplay">
         <i class="material-icons" style="color:#fff;font-size:40px;">&#xE029;</i>
      </div>
      <div id="ammoDisplay" onclick="dropWeapon()">Ammo</div>
      <div id="infoDisplay"></div>
      <div id="killTextCont">
         <div id="killText"></div>
         <div id="killInfo"></div>
      </div>
      <div id="staminaDisplay">
         <div id="effectsList"></div>
         <canvas id="staminaHolder"></canvas>
      </div>
   </div>
   
   <!-- MAIN MENU -->
   <div id="mainMenuContainer" style="display:none">
      <div id="gameName">game name</div>
      <div class="mainMenuSub" id="adParent">
         <div class="menuCard" id="adCard">
            <div align="center" id="foesio_300x250_1">
               <script data-cfasync="false" type="text/javascript">
                  // freestar.queue.push(function () { googletag.display('foesio_300x250_1'); });
               </script>
            </div>
         </div>
      </div>
      <div class="mainMenuSub" id="buttonCardParent">
         <div class="menuCard" id="buttonCard">
            <div id="nameInputParent">
               <input type="text" id="nameInput" maxlength="16" placeholder="Enter Name"
                  ontouchend="touchPrompt(event, 'Enter username:')" autofocus></input>
               <div class="menuButton" id="goButton">
                  <i class="material-icons" style="color:#fff;font-size:32px;">&#xE037;</i>
               </div>
            </div>
            <div class="menuButton" style="margin-top:10px" onclick="window.showInfoScreen(0)">Customize</div>
            <div class="menuButton" style="margin-top:10px" onclick="showInfoScreen(1)">Servers</div>
            <div class="menuButton" style="margin-top:10px" onclick="showInfoScreen(2)">Account</div>
            <div class="menuButton" style="margin-top:10px" onclick="showInfoScreen(3)">How to Play</div>
            <!-- <div class="menuButton" style="margin-top:10px" onclick="location.reload()">Reload</div> -->
         </div>
      </div>
      <div class="mainMenuSub" id="infoCardParent">
         <div class="menuCard" id="infoCard" style="text-align:left;max-height:250px;overflow-y:scroll"></div>
         <div id="downloadButtonContainer" class="menuCard">
            <a class="downloadBadge"
               href="https://web.archive.org/web/20190120075244/https://itunes.apple.com/us/app/foes-io/id1326084378?ls=1&amp;mt=8"
               target="_blank"><img src="/web/20190120075244im_/https://foes.io/images/badges/ios.svg"></a></img>
            <a class="downloadBadge"
               href="https://web.archive.org/web/20190120075244/https://play.google.com/store/apps/details?id=com.yendis.foes"
               target="_blank"><img src="/web/20190120075244im_/https://foes.io/images/badges/android.png"></img></a>
         </div>
      </div>
   </div>
   <!-- HOVER INFO -->
   <div id="hoverDisplay"></div>
</body>

</html>
